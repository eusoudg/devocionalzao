<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f6a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Devocional">
<title>Devocional</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f6f3ee; --card:#ffffff; --text:#1f2a30; --muted:#6b7780; --line:#e4ded4;
  --accent:#2f6f6a; --accent-soft:#dcebe8; --on-accent:#ffffff;
  --gold:#b9822f; --done:#3f8f5f; --done-soft:#dcefe3; --danger:#b4443c;
  --shadow:0 1px 2px rgba(31,42,48,.06),0 4px 14px rgba(31,42,48,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181b; --card:#1b2428; --text:#e8eef0; --muted:#93a2a9; --line:#2a363b;
    --accent:#5fb3aa; --accent-soft:#1f3a38; --on-accent:#0d1a19;
    --gold:#d9a557; --done:#5cb77f; --done-soft:#1e3a2a; --danger:#e0766d;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#12181b; --card:#1b2428; --text:#e8eef0; --muted:#93a2a9; --line:#2a363b;
  --accent:#5fb3aa; --accent-soft:#1f3a38; --on-accent:#0d1a19;
  --gold:#d9a557; --done:#5cb77f; --done-soft:#1e3a2a; --danger:#e0766d;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
#app{max-width:560px;margin:0 auto;padding:16px 16px 8px;padding-top:calc(16px + env(safe-area-inset-top))}
h1{font-size:1.35rem;margin:0 0 4px}
h2{font-size:1.05rem;margin:0 0 10px}
h3{font-size:.8rem;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.center{text-align:center}
button{font:inherit;color:inherit;cursor:pointer}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font-weight:600;
}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.block{display:flex;width:100%}
.btn.small{min-height:36px;padding:0 12px;border-radius:10px;font-size:.85rem}
.btn:active{transform:scale(.98)}
.link{background:none;border:none;color:var(--accent);padding:8px 4px;font-weight:600;text-decoration:underline}
input,select,textarea{
  font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;width:100%;min-height:46px;
}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Timer */
.clock{font-size:3.4rem;font-weight:700;text-align:center;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:8px 0 2px}
.state{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:.9rem;margin-bottom:14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.run{background:var(--done);animation:pulse 1.6s infinite}
.dot.pause{background:var(--gold)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.prompt{border-left:3px solid var(--gold);padding:2px 0 2px 12px;color:var(--muted);font-style:italic}

/* Bars */
.bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 3px 3px;min-height:4px;opacity:.9}
.bar i.zero{background:var(--line)}
.bar span{font-size:.72rem;color:var(--muted)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);border-radius:99px;transition:width .2s}
.progress.done>div{background:var(--done)}

/* Calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-weight:700;font-size:1.05rem}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{text-align:center;font-size:.75rem;color:var(--muted);padding:4px 0}
.day{
  position:relative;aspect-ratio:1/1.05;border-radius:12px;border:1px solid transparent;
  background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.95rem;padding:0;line-height:1.1;
}
.day small{font-size:.62rem;color:var(--muted);margin-top:2px;min-height:.7rem}
.day.empty{pointer-events:none}
.day.done{background:var(--done-soft);color:var(--done);font-weight:700;border-color:var(--done)}
.day.done small{color:var(--done)}
.day.missed{color:var(--muted);background:var(--bg);border-color:var(--line)}
.day.missed small::after{content:"·";font-size:1rem}
.day.future{color:var(--muted);opacity:.55}
.day.today{outline:2px solid var(--accent);outline-offset:1px}
.day.sel{box-shadow:0 0 0 3px var(--accent-soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:12px}
.legend b{display:inline-block;width:11px;height:11px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.sess{border-top:1px solid var(--line);padding:12px 0}
.sess:first-of-type{border-top:none}

/* Bible */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:10px 0 4px}
.seg button{flex:1;border:none;background:none;min-height:38px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.book{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.book .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
.book .name{font-weight:600}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;margin:12px 0}
.chap{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.chap.on{background:var(--done);border-color:var(--done);color:#fff}

/* Lists */
.item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.tag{display:inline-block;font-size:.72rem;background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:99px;font-weight:600}
.tag.ok{background:var(--done-soft);color:var(--done)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.3rem}
.stat span{font-size:.78rem;color:var(--muted)}
.empty-msg{color:var(--muted);text-align:center;padding:14px 0}

/* Nav */
nav{
  position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20;
}
nav .in{display:flex;width:100%;max-width:560px}
nav button{
  flex:1;border:none;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:.7rem;color:var(--muted);min-height:58px;
}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent);font-weight:700}

/* Modal + toast */
#modal{
  position:fixed;inset:0;background:rgba(10,16,18,.55);display:none;z-index:50;
  align-items:flex-end;justify-content:center;
}
#modal.open{display:flex}
.sheet{
  background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
}
@media (min-width:600px){ #modal{align-items:center} .sheet{border-radius:20px} }
#toast{
  position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;
}
#toast.show{opacity:1}
.warn{background:#fff4d6;color:#6b4e00;border:1px solid #ecd48a;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.88rem}
</style>
</head>
<body>
<noscript>Este aplicativo precisa de JavaScript ativado.</noscript>
<div id="app"><div id="page"></div></div>

<nav>
  <div class="in">
    <button data-a="tab" data-t="hoje" id="n-hoje"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>Hoje</button>
    <button data-a="tab" data-t="cal" id="n-cal"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><line x1="3.5" y1="10" x2="20.5" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>Calendário</button>
    <button data-a="tab" data-t="biblia" id="n-biblia"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>Bíblia</button>
    <button data-a="tab" data-t="oracao" id="n-oracao"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>Oração</button>
    <button data-a="tab" data-t="mais" id="n-mais"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Mais</button>
  </div>
</nav>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
"use strict";
(function () {

/* ============ Dados fixos: 66 livros (cânon protestante) ============ */
var BOOKS = [
["Gênesis",50,"AT"],["Êxodo",40,"AT"],["Levítico",27,"AT"],["Números",36,"AT"],["Deuteronômio",34,"AT"],
["Josué",24,"AT"],["Juízes",21,"AT"],["Rute",4,"AT"],["1 Samuel",31,"AT"],["2 Samuel",24,"AT"],
["1 Reis",22,"AT"],["2 Reis",25,"AT"],["1 Crônicas",29,"AT"],["2 Crônicas",36,"AT"],["Esdras",10,"AT"],
["Neemias",13,"AT"],["Ester",10,"AT"],["Jó",42,"AT"],["Salmos",150,"AT"],["Provérbios",31,"AT"],
["Eclesiastes",12,"AT"],["Cantares",8,"AT"],["Isaías",66,"AT"],["Jeremias",52,"AT"],["Lamentações",5,"AT"],
["Ezequiel",48,"AT"],["Daniel",12,"AT"],["Oseias",14,"AT"],["Joel",3,"AT"],["Amós",9,"AT"],
["Obadias",1,"AT"],["Jonas",4,"AT"],["Miqueias",7,"AT"],["Naum",3,"AT"],["Habacuque",3,"AT"],
["Sofonias",3,"AT"],["Ageu",2,"AT"],["Zacarias",14,"AT"],["Malaquias",4,"AT"],
["Mateus",28,"NT"],["Marcos",16,"NT"],["Lucas",24,"NT"],["João",21,"NT"],["Atos",28,"NT"],
["Romanos",16,"NT"],["1 Coríntios",16,"NT"],["2 Coríntios",13,"NT"],["Gálatas",6,"NT"],["Efésios",6,"NT"],
["Filipenses",4,"NT"],["Colossenses",4,"NT"],["1 Tessalonicenses",5,"NT"],["2 Tessalonicenses",3,"NT"],
["1 Timóteo",6,"NT"],["2 Timóteo",4,"NT"],["Tito",3,"NT"],["Filemom",1,"NT"],["Hebreus",13,"NT"],
["Tiago",5,"NT"],["1 Pedro",5,"NT"],["2 Pedro",3,"NT"],["1 João",5,"NT"],["2 João",1,"NT"],
["3 João",1,"NT"],["Judas",1,"NT"],["Apocalipse",22,"NT"]
];
var TOTAL_CHAPTERS = 0;
BOOKS.forEach(function (b) { TOTAL_CHAPTERS += b[1]; });

var MONTHS = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
var DOW = ["D","S","T","Q","Q","S","S"];
var CATS = ["Família","Igreja","Amigos","Trabalho/Estudos","Pessoal","Outros"];
var PROMPTS = [
  "Antes de começar, respire fundo e entregue este tempo a Deus.",
  "Leia devagar. Uma passagem bem meditada vale mais que muitas lidas com pressa.",
  "Pergunte: o que este texto mostra sobre Deus? E sobre mim?",
  "Termine agradecendo por algo concreto de hoje.",
  "Se a cabeça estiver cheia, comece contando a Deus como você está de verdade.",
  "Não precisa ser perfeito. Basta estar presente."
];

/* ============ Armazenamento ============ */
var KEY = "devocional_v1";
var storageOK = true;

function normalize(d) {
  d = (d && typeof d === "object" && !Array.isArray(d)) ? d : {};
  var t = null;
  if (d.timer && typeof d.timer === "object" && isFinite(d.timer.started) && isFinite(d.timer.acc)) {
    t = { started: +d.timer.started, acc: +d.timer.acc, since: isFinite(d.timer.since) && d.timer.since ? +d.timer.since : null };
  }
  return {
    sessions: (Array.isArray(d.sessions) ? d.sessions : []).filter(function (s) {
      return s && isFinite(s.start) && isFinite(s.secs) && s.secs >= 0;
    }),
    read: (d.read && typeof d.read === "object" && !Array.isArray(d.read)) ? d.read : {},
    prayers: (Array.isArray(d.prayers) ? d.prayers : []).filter(function (p) { return p && typeof p.text === "string"; }),
    verses: (Array.isArray(d.verses) ? d.verses : []).filter(function (v) { return v && typeof v.ref === "string"; }),
    timer: t,
    theme: (d.theme === "light" || d.theme === "dark") ? d.theme : "auto"
  };
}
function loadDB() {
  var raw = null, d = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { storageOK = false; }
  if (raw) { try { d = JSON.parse(raw); } catch (e) { d = null; } }
  return normalize(d);
}
var db = loadDB();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { storageOK = false; }
}
(function testStorage() {
  try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); } catch (e) { storageOK = false; }
})();

/* ============ Utilidades ============ */
function $(s) { return document.querySelector(s); }
function p2(n) { return (n < 10 ? "0" : "") + n; }
function dk(ts) { var d = new Date(ts); return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
function parseKey(k) { var a = k.split("-"); return new Date(+a[0], +a[1] - 1, +a[2], 12, 0, 0); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function fmtClock(ms) {
  var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return (h > 0 ? h + ":" + p2(m) : p2(m)) + ":" + p2(r);
}
function fmtDur(secs) {
  if (secs > 0 && secs < 60) return "< 1 min";
  var m = Math.round(secs / 60), h = Math.floor(m / 60);
  if (h > 0) return h + "h " + p2(m % 60) + "min";
  return m + " min";
}
function fmtTime(ts) { var d = new Date(ts); return p2(d.getHours()) + ":" + p2(d.getMinutes()); }
function fmtDateBR(k) { var a = k.split("-"); return a[2] + "/" + a[1] + "/" + a[0]; }
function toast(msg) {
  var t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("show"); }, 2400);
}
function bySession(a, b) { return a.start - b.start; }
function groupByDate() {
  var m = {};
  db.sessions.forEach(function (s) { var k = dk(s.start); (m[k] = m[k] || []).push(s); });
  Object.keys(m).forEach(function (k) { m[k].sort(bySession); });
  return m;
}
function sumSecs(list) { return list.reduce(function (a, s) { return a + s.secs; }, 0); }
function readOf(i) {
  var a = db.read[i];
  if (!Array.isArray(a)) return [];
  var max = BOOKS[i][1], seen = {}, out = [];
  a.forEach(function (n) { if (Number.isInteger(n) && n >= 1 && n <= max && !seen[n]) { seen[n] = 1; out.push(n); } });
  return out;
}
function markRange(i, from, to) {
  var set = {};
  readOf(i).forEach(function (n) { set[n] = 1; });
  for (var c = from; c <= to; c++) set[c] = 1;
  db.read[i] = Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
}
function passageLabel(s) {
  if (typeof s.book !== "number" || !BOOKS[s.book]) return "";
  var t = BOOKS[s.book][0];
  if (s.from) t += " " + s.from + (s.to && s.to !== s.from ? "–" + s.to : "");
  return t;
}
function streak() {
  var days = {}; db.sessions.forEach(function (s) { days[dk(s.start)] = 1; });
  var d = new Date(); d.setHours(12, 0, 0, 0);
  if (!days[dk(d)]) d.setDate(d.getDate() - 1);
  var n = 0;
  while (days[dk(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ============ Estado de interface ============ */
var tab = "hoje";
var now = new Date();
var cal = { y: now.getFullYear(), m: now.getMonth() };
var selDay = dk(Date.now());
var bibFilter = "AT";
var prFilter = "open";
var modalCtx = null;

/* ============ Cronômetro ============ */
function elapsedMs() {
  var t = db.timer; if (!t) return 0;
  return t.acc + (t.since ? Date.now() - t.since : 0);
}
function timerStart() { db.timer = { started: Date.now(), acc: 0, since: Date.now() }; save(); render(); }
function timerPause() { var t = db.timer; if (!t || !t.since) return; t.acc += Date.now() - t.since; t.since = null; save(); render(); }
function timerResume() { var t = db.timer; if (!t || t.since) return; t.since = Date.now(); save(); render(); }
setInterval(function () {
  var c = $("#clock"); if (c) c.textContent = fmtClock(elapsedMs());
}, 250);

/* ============ Modal ============ */
function openModal(html, ctx) { modalCtx = ctx || null; $("#sheet").innerHTML = html; $("#modal").classList.add("open"); $("#sheet").scrollTop = 0; }
function closeModal() { $("#modal").classList.remove("open"); $("#sheet").innerHTML = ""; modalCtx = null; render(); }

function bookOptions(sel) {
  var h = '<option value="">— sem passagem —</option>';
  BOOKS.forEach(function (b, i) { h += '<option value="' + i + '"' + (sel === i ? " selected" : "") + ">" + esc(b[0]) + "</option>"; });
  return h;
}
function passageFields() {
  return '<label for="f-book">Passagem lida (opcional)</label>' +
    '<select id="f-book">' + bookOptions(-1) + '</select>' +
    '<div class="grid2"><div><label for="f-from">Do capítulo</label><input id="f-from" type="number" inputmode="numeric" min="1"></div>' +
    '<div><label for="f-to">Até o capítulo</label><input id="f-to" type="number" inputmode="numeric" min="1"></div></div>' +
    '<p class="small muted" style="margin-top:6px">Os capítulos informados serão marcados como lidos na aba Bíblia.</p>' +
    '<label for="f-note">O que Deus falou comigo hoje? (opcional)</label>' +
    '<textarea id="f-note" placeholder="Uma frase, um versículo, uma aplicação..."></textarea>';
}
function readPassage() {
  var b = $("#f-book").value;
  var note = $("#f-note").value.trim();
  if (b === "") return { ok: true, book: null, from: null, to: null, note: note };
  var bi = +b, max = BOOKS[bi][1];
  var from = parseInt($("#f-from").value, 10), to = parseInt($("#f-to").value, 10);
  if (isNaN(from)) return { ok: true, book: bi, from: null, to: null, note: note };
  if (isNaN(to)) to = from;
  if (from > to) { var x = from; from = to; to = x; }

function viewHoje() {

function viewCal() {

function exportData() {
  var blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "devocional-backup-" + dk(Date.now()) + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast("Backup gerado.");
}
function importData(file) {
  var r = new FileReader();
  r.onload = function () {
    var d;
    try { d = JSON.parse(String(r.result)); } catch (e) { toast("Arquivo inválido."); return; }
    if (!d || typeof d !== "object" || !("sessions" in d || "read" in d || "prayers" in d)) { toast("Este não parece um backup do Devocional."); return; }
    if (!confirm("Importar este backup vai substituir os dados atuais. Continuar?")) return;
    db = normalize(d); save(); render(); toast("Backup importado.");
  };
  r.onerror = function () { toast("Não foi possível ler o arquivo."); };
  r.readAsText(file);
}

document.addEventListener("click", function (e) {
  if (e.target.id === "modal") { closeModal(); return; }
  var el = e.target.closest("[data-a]"); if (!el) return;
  var a = el.dataset.a, id = el.dataset.id, i;
  switch (a) {
    case "tab": tab = el.dataset.t; render(); window.scrollTo(0, 0); break;
    case "t-start": timerStart(); break;
    case "t-pause": timerPause(); break;
    case "t-resume": timerResume(); break;
    case "t-finish": timerPause(); openFinish(); break;
    case "s-save": saveFinish(); break;
    case "s-back": closeModal(); break;
    case "s-discard": if (confirm("Descartar este tempo sem salvar?")) { db.timer = null; save(); closeModal(); } break;
    case "m-add": openManual(el.dataset.k); break;
    case "m-save": saveManual(); break;
    case "close": closeModal(); break;
    case "s-del":
      if (confirm("Excluir este registro?")) { db.sessions = db.sessions.filter(function (s) { return s.id !== id; }); save(); render(); }
      break;
    case "cal-prev": cal.m--; if (cal.m < 0) { cal.m = 11; cal.y--; } render(); break;
    case "cal-next": cal.m++; if (cal.m > 11) { cal.m = 0; cal.y++; } render(); break;
    case "cal-today": cal = { y: new Date().getFullYear(), m: new Date().getMonth() }; selDay = dk(Date.now()); render(); break;
    case "cal-sel": selDay = el.dataset.k; render(); break;
    case "bib-f": bibFilter = el.dataset.f; render(); window.scrollTo(0, 0); break;
    case "bk-open": i = +el.dataset.b; openModal(bookSheet(i), { type: "book", b: i }); break;
    case "chap":
      i = +el.dataset.b;
      var c = +el.dataset.c, cur = readOf(i), pos = cur.indexOf(c);
      if (pos >= 0) cur.splice(pos, 1); else cur.push(c);
      db.read[i] = cur.sort(function (x, y) { return x - y; }); save(); updateBookSheet(i);
      break;
    case "bk-all": i = +el.dataset.b; markRange(i, 1, BOOKS[i][1]); save(); updateBookSheet(i); break;
    case "bk-clear": i = +el.dataset.b; db.read[i] = []; save(); updateBookSheet(i); break;
    case "pr-f": prFilter = el.dataset.f; render(); break;
    case "pr-add":
      var tx = $("#pr-text").value.trim(); if (!tx) { toast("Escreva o pedido primeiro."); break; }
      db.prayers.push({ id: uid(), text: tx, cat: $("#pr-cat").value, created: Date.now(), answered: null });
      save(); prFilter = "open"; render(); toast("Pedido adicionado.");
      break;
    case "pr-toggle":
      db.prayers.forEach(function (p) { if (p.id === id) p.answered = p.answered ? null : Date.now(); });
      save(); render();
      break;
    case "pr-del":
      if (confirm("Excluir este pedido?")) { db.prayers = db.prayers.filter(function (p) { return p.id !== id; }); save(); render(); }
      break;
    case "vs-add":
      var ref = $("#vs-ref").value.trim(); if (!ref) { toast("Informe a referência."); break; }
      db.verses.push({ id: uid(), ref: ref, text: $("#vs-text").value.trim(), done: false }); save(); render();
      break;
    case "vs-toggle": db.verses.forEach(function (v) { if (v.id === id) v.done = !v.done; }); save(); render(); break;
    case "vs-del": if (confirm("Excluir este versículo?")) { db.verses = db.verses.filter(function (v) { return v.id !== id; }); save(); render(); } break;
    case "theme": db.theme = el.dataset.v; save(); render(); break;
    case "exp": exportData(); break;
    case "imp": $("#imp-file").click(); break;
    case "reset":
      if (confirm("Apagar TODOS os dados do aplicativo? Isso não pode ser desfeito.") && confirm("Tem certeza? Faça um backup antes se quiser guardar algo.")) {
        db = normalize(null); save(); render(); toast("Dados apagados.");
      }
      break;
  }
});
document.addEventListener("change", function (e) {
  if (e.target.id === "imp-file" && e.target.files && e.target.files[0]) { importData(e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("visibilitychange", function () { if (!document.hidden) { var c = $("#clock"); if (c) c.textContent = fmtClock(elapsedMs()); } });

/* ============ Início ============ */
render();
if (db.timer && db.timer.since) { /* cronômetro retomado automaticamente após reabrir */ }
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
window.__devocional = { BOOKS: BOOKS, TOTAL_CHAPTERS: TOTAL_CHAPTERS };

})();
</script>
</body>
</html>
